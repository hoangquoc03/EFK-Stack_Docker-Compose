<source>
  @type forward
  @id input_forward
  bind 0.0.0.0
  port 24224
</source>

<filter **>
  @type parser
  @id parse_json_logs
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
    json_parser json
  </parse>
</filter>

<match **>
  @type elasticsearch
  @id output_elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix quickbite
  include_tag_key true
  tag_key docker_tag
  suppress_type_name true
  reconnect_on_error true
  request_timeout 15s

  <buffer tag>
    @type file
    path /fluentd/buffer/elasticsearch
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 2m
    total_limit_size 256m
    retry_type exponential_backoff
    retry_forever true
    retry_max_interval 30s
    overflow_action block
  </buffer>
</match>
