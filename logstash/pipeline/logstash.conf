input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![app_name] or [app_name] == "" {
    mutate {
      replace => { "app_name" => "unknown-service" }
    }
  }

  mutate {
    lowercase => [ "app_name" ]
  }

  mutate {
    gsub => [
      "app_name", "[^a-z0-9_-]", "-",
      "app_name", "\A[-_]+", "service-"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[app_name]}-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
